version: "3.9"

services:
  # ── FastAPI Backend ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: digirakshak-api
    ports:
      - "8000:8000"
    volumes:
      - ./ml:/app/ml
      - ./server:/app/server
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ml_models:
